# Optional: docker compose up  -> http://localhost:8080
services:
  ocr:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./services/ocr:/app"]
    command: sh -c "apt-get update -qq && apt-get install -y -qq libgl1 libglib2.0-0 >/dev/null && pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8001"
  core:
    image: node:22-slim
    working_dir: /app/services/core
    volumes: [".:/app", "yms-data:/app/services/core/data", "/app/services/core/node_modules"]
    environment: { PORT: "8080", OCR_URL: "http://ocr:8001" }
    command: sh -c "npm ci --no-audit --no-fund && npx tsx src/server.ts"
    ports: ["8080:8080"]
    depends_on: [ocr]
volumes: { yms-data: {} }
