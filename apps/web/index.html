<script>/* apply theme before paint: stored choice, else OS preference */
(function(){try{var t=localStorage.getItem("yms.theme");var d=t==="dark"||t==="light"?t:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=d;}catch(e){document.documentElement.dataset.theme="dark";}})();</script></head>
